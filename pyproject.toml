[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldlight-proofs"
version = "0.2.0"
description = "Immutable provenance manifests and optional Bitcoin anchors for Fieldlight artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fieldlight" }]

[project.scripts]
fieldlight-proof = "fieldlight_proofs.cli:main"
